name = "barge"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[[durable_objects.bindings]]
name = "ORCHARD"
class_name = "Orchard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Orchard"]

[[routes]]
pattern = "bargedot.fun"
custom_domain = true

[[routes]]
pattern = "www.bargedot.fun"
custom_domain = true
